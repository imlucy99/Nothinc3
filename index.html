<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JGVRP Speedometer HUD</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div class="hud booting" id="hud">
    <!-- DIAL RPM (ticks, angka & jarum dibuat oleh script.js) -->
    <svg id="dial" class="dial" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%"   stop-color="#4a4a4a" />
          <stop offset="22%"  stop-color="#f4f4f4" />
          <stop offset="45%"  stop-color="#6b6b6b" />
          <stop offset="70%"  stop-color="#dcdcdc" />
          <stop offset="100%" stop-color="#363636" />
        </linearGradient>
        <radialGradient id="face-grad" cx="50%" cy="50%" r="55%">
          <stop offset="0%"   stop-color="#1b1b1c" />
          <stop offset="60%"  stop-color="#0b0b0c" />
          <stop offset="100%" stop-color="#000000" />
        </radialGradient>
        <radialGradient id="disc-grad" cx="50%" cy="38%" r="75%">
          <stop offset="0%"   stop-color="#161d27" />
          <stop offset="100%" stop-color="#04060a" />
        </radialGradient>
        <linearGradient id="needle-grad" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%"   stop-color="#d81408" />
          <stop offset="100%" stop-color="#ff4a3a" />
        </linearGradient>
        <filter id="needle-glow" x="-30%" y="-300%" width="160%" height="700%">
          <feGaussianBlur stdDeviation="2.2" result="blur" />
          <feMerge>
            <feMergeNode in="blur" />
            <feMergeNode in="SourceGraphic" />
          </feMerge>
        </filter>
      </defs>

      <!-- Bezel chrome + wajah dial -->
      <circle class="bezel" cx="200" cy="200" r="195" />
      <circle class="face" cx="200" cy="200" r="192" />
      <circle class="face-ring" cx="200" cy="200" r="188" />

      <g id="ticks"></g>
      <g id="labels"></g>
      <text class="rpm-unit" x="200" y="97" text-anchor="middle">x1000 r/min</text>

      <!-- Jarum RPM (merah, berada di luar layar tengah) -->
      <g id="needle" filter="url(#needle-glow)">
        <path d="M92 -3.6 L150 -1.5 L150 1.5 L92 3.6 Z" fill="url(#needle-grad)" />
        <rect x="149" y="-3.3" width="6" height="6.6" rx="1" fill="#cfcfcf" />
        <rect x="90" y="-4.8" width="10" height="9.6" rx="1.5" fill="#8d8d8d" />
      </g>

      <!-- Layar tengah (polos, tanpa gambar) -->
      <circle class="disc-bezel" cx="200" cy="200" r="91" />
      <circle cx="200" cy="200" r="88.5" fill="url(#disc-grad)" />
    </svg>

    <!-- ISI LAYAR TENGAH -->
    <div class="disc" id="disc">
      <div class="disc-ui">
        <div class="gear-row">
          <span class="gear-line"></span>
          <span id="gear" class="gear">N</span>
          <span class="gear-line"></span>
        </div>
        <div id="clock" class="clock">--:--</div>

        <div class="speed-wrap">
          <div id="speed-display" class="speed-text">0</div>
          <div id="speed-mode" class="speed-unit">MPH</div>
        </div>

        <!-- Bensin (%) & Engine Health (PSI) -->
        <div class="stat-row">
          <div id="fuel-group" class="stat">
            <svg class="stat-icon" viewBox="0 0 24 24" fill="currentColor">
              <path d="M19 11h-1V3c0-.55-.45-1-1-1H7c-.55 0-1 .45-1 1v18h12c.55 0 1-.45 1-1v-6c0-1.66-1.34-3-3-3zm-3 2c.55 0 1 .45 1 1v4h-2v-5h1zM8 4h8v5H8V4z"/>
            </svg>
            <span id="fuel-value" class="stat-value">--%</span>
          </div>
          <div id="health-group" class="stat">
            <svg class="stat-icon" viewBox="0 0 24 24" fill="currentColor">
              <path d="M22 12c0-.6-.4-1-1-1h-2V9c0-.6-.4-1-1-1h-2V5c0-.6-.4-1-1-1H9c-.6 0-1 .4-1 1v3H6c-.6 0-1 .4-1 1v2H3c-.6 0-1 .4-1 1v3c0 .6.4 1 1 1h2v2c0 .6.4 1 1 1h12c.6 0 1-.4 1-1v-2h2c.6 0 1-.4 1-1v-3zM10 6h4v2h-4V6z"/>
            </svg>
            <span id="health-value" class="stat-value">--</span><span class="stat-unit">PSI</span>
          </div>
        </div>

        <div class="odo-row">
          <span class="lcd-label">ODO</span>
          <span class="odo-value"><span id="odometer">0.0</span> <span id="odo-unit">mi</span></span>
        </div>
      </div>

      <!-- Intro: animasi ANNIS (diganti logo.png jika ada) -->
      <div id="intro" class="intro">
        <div id="brand" class="brand" aria-label="ANNIS"></div>
      </div>
    </div>

    <!-- INDIKATOR BAWAH (tengah, di ruang kosong bawah dial) -->
    <div id="indicators" class="bottom-indicators">
      <!-- Lampu: low beam = hijau (garis miring), high beam = biru (garis lurus) -->
      <div id="headlight" class="icon-item headlight" title="Lampu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 6a6 6 0 0 1 6 6 6 6 0 0 1-6 6V6z"/>
          <g class="beam-low">
            <line x1="3" y1="9" x2="7" y2="10"/><line x1="3" y1="12" x2="7" y2="12"/><line x1="3" y1="15" x2="7" y2="14"/>
          </g>
          <g class="beam-high">
            <line x1="2" y1="8" x2="7" y2="8"/><line x1="2" y1="12" x2="7" y2="12"/><line x1="2" y1="16" x2="7" y2="16"/>
          </g>
        </svg>
      </div>
      <div id="seatbelts" class="icon-item" title="Sabuk Pengaman">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <circle cx="12" cy="4" r="2.2"/>
          <path d="M8 8h8l1 7h-2l-.5 7h-5L9 15H7z" opacity=".9"/>
          <path d="M7.5 8.5 16.5 17" stroke="#000" stroke-width="1.6"/>
        </svg>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
